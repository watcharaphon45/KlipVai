services:
  postgres:
    image: postgres:16-alpine
    container_name: klipvai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: short_video_editor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d short_video_editor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
